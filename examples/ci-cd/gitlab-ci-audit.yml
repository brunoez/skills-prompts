# ==============================================================================
# GitLab CI Pipeline: Auditoria de Segurança com IA & Sync (GitLab Issues)
# Modelo para uso em Projetos Privados de Clientes / Empresas no GitLab
# ==============================================================================

stages:
  - security
  - notify

ai:appsec-audit:
  stage: security
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - apt-get update && apt-get install -y curl git
    - pip install reportlab matplotlib
    - |
      if [ ! -d ".agent/prompts" ]; then
        curl -sSL https://raw.githubusercontent.com/brunoez/skills-prompts/main/install.sh | bash
      fi
  script:
    - echo "🚀 Executando auditoria profunda com IA no GitLab CI..."
    - mkdir -p docs/api-audit
    # Exemplo: Chamar o agente de IA passando a chave configurada em CI/CD Variables
    # claude --prompt "@[.agent/prompts/security/api.md] Realize a auditoria de código e gere o relatório PDF e SARIF"
  artifacts:
    name: "relatorio-auditoria-api-$CI_COMMIT_SHORT_SHA"
    when: always
    expire_in: 30 days
    paths:
      - docs/api-audit/*.pdf
      - docs/api-audit/results.sarif
    reports:
      sast: docs/api-audit/results.sarif

ai:sync-issues:
  stage: notify
  image: python:3.11-slim
  needs: ["ai:appsec-audit"]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - echo "📌 Sincronizando vulnerabilidades com o GitLab Issues & Boards..."
    - python3 .agent/prompts/examples/ci-cd/gitlab_issues_sync.py || python3 examples/ci-cd/gitlab_issues_sync.py
