# ==============================================================================
# GitLab CI Pipeline: Validação de Qualidade e Integridade
# Repositório: brunoez/skills-prompts
# ==============================================================================

stages:
  - lint
  - test

lint:scripts:
  stage: lint
  image: koalaman/shellcheck-alpine:latest
  script:
    - shellcheck install.sh

test:integrity:
  stage: test
  image: python:3.11-alpine
  before_script:
    - apk add --no-cache bash git
  script:
    - python3 tests/test_integrity.py
